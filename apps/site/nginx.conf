# apps/site/nginx.conf
# Production nginx config for the Angular SPA.
# Mounted at /etc/nginx/conf.d/default.conf inside the runtime image.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ── Compression ──────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # ── Security headers (lightweight; Cloudflare adds more on top) ─
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # ── Hashed assets (Angular build emits content-hashed filenames) ─
    # main-XXXX.js, styles-XXXX.css, chunk-XXXX.js, polyfills-XXXX.js, etc.
    # Safe to cache forever because the filename changes when the content changes.
    location ~* \.(js|css|woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Images & other static media ──────────────────────────────
    location ~* \.(jpg|jpeg|png|webp|avif|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    # ── index.html — never cache; must always revalidate ─────────
    # This is the deploy boundary: when index.html updates, it points
    # to new hashed assets; old assets are still cached and still valid.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # ── SEO crawler files — proxy to API (dynamic sitemap) ──────
    # The sitemap is generated by the API (reads live content from DB).
    # A static sitemap baked into the Angular build would miss every
    # gear / listing / article / thread added after the last site deploy.
    #
    # `resolver` + `set $api` forces runtime DNS rather than the nginx
    # default (compile-time). Without it, nginx refuses to start when the
    # API host can't be resolved during container boot.
    resolver 8.8.8.8 1.1.1.1 valid=60s ipv6=off;
    set $api_upstream "https://api.sintezaur.ro";

    location = /sitemap.xml {
        proxy_pass          $api_upstream/sitemap.xml;
        proxy_set_header    Host api.sintezaur.ro;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        expires             1h;
        add_header          Cache-Control "public, max-age=3600" always;
        access_log          off;
    }

    # robots.txt is served as a static file from apps/site/public/robots.txt
    # (copied into the image at build time) — no proxy needed.
    # The file points Sitemap to https://sintezaur.ro/sitemap.xml.

    # ── SPA fallback ─────────────────────────────────────────────
    # Any path that isn't a real file gets index.html so Angular Router
    # can take over and resolve client-side routes (/tezaur/:slug, etc.).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health probe for Coolify / load balancers.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
