<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <title>Sintezaur — platforma de music gear în limba română</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Belt-and-braces cache control. The hashed JS / CSS chunks
         in this index.html change on every build; serving a stale
         index.html (CDN / browser cache) ends up requesting a chunk
         filename that no longer exists → 404 → blank app. The proper
         fix is server-side (nginx config), but the meta tags catch
         the case where Cloudflare / Nginx haven't been configured
         yet. Browsers honour these for the document load even though
         they don't override CDN edge caches. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <meta name="description" content="Sintezaur — platforma în limba română pentru sintetizatoare și music gear: Tezaur (catalog), Bazar (anunțuri), Revista (articole), Forum (comunitate)." />

    <!-- Favicons. .ico bundles 16/32/48 for legacy browsers; PNGs cover
         high-DPI tabs, Android home-screen, iOS apple-touch. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d0d0d" />

    <!-- Open Graph + Twitter — static defaults for link previews
         (WhatsApp / Facebook / Slack / Telegram scrapers don't run
         JavaScript, so OG tags MUST live in the initial HTML response;
         the SeoService still updates them in-app for client-side nav). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sintezaur" />
    <meta property="og:title" content="Sintezaur — platforma de music gear în limba română" />
    <meta property="og:description" content="Tezaur (catalog) · Bazar (anunțuri) · Revistă (articole) · Forum (comunitate). În limba română." />
    <meta property="og:url" content="https://sintezaur.ro/" />
    <meta property="og:image" content="https://sintezaur.ro/assets/branding/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sintezaur — platforma de music gear în limba română" />
    <meta property="og:locale" content="ro_RO" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sintezaur — platforma de music gear în limba română" />
    <meta name="twitter:description" content="Tezaur (catalog) · Bazar (anunțuri) · Revistă (articole) · Forum (comunitate). În limba română." />
    <meta name="twitter:image" content="https://sintezaur.ro/assets/branding/og-default.png" />
    <meta name="twitter:image:alt" content="Sintezaur — platforma de music gear în limba română" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
