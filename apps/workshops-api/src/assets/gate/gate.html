<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sintezaur Workshops</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Self-contained gate (nothing else is served unauthenticated): screen 1
     is the Sintezaur-branded workshop selection, screen 2 the workshop's
     own dark login. System font fallbacks by design. */
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 16px; -webkit-font-smoothing: antialiased;
  }
  .hidden { display: none !important; }
  .langs { display: flex; gap: 10px; }
  .pill { padding: 7px 20px; border-radius: 999px; font-size: 14px;
    letter-spacing: 3px; background: none; border: 2px solid #454545;
    color: #8f8f8f; cursor: pointer; font-family: inherit; }
  .pill.on { border-color: var(--accent); color: var(--accent); }

  /* ---- screen 1: Sintezaur selection ---- */
  .select { --accent: #ebb023; min-height: 100dvh; background: #0a0a0b;
    background-image: radial-gradient(circle at 1px 1px, rgba(235,176,35,0.16) 1px, transparent 0);
    background-size: 24px 24px; color: #edecea; }
  .select .wrap { max-width: 920px; margin: 0 auto; min-height: 100dvh;
    padding: 22px clamp(16px, 4vw, 40px) 40px; display: flex; flex-direction: column; }
  .select .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .select .brandrow { display: flex; align-items: center; gap: 12px; }
  .select .logo { height: 40px; width: auto; display: block; }
  .select .wordmark { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    font-size: 13px; font-weight: 600; letter-spacing: 0.45em; }
  .select .kicker { margin: clamp(48px, 10vh, 110px) 0 0;
    font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: #8e8d8a; }
  .select .kicker::before { content: '* '; color: #ebb023; }
  .select h1 { margin: 10px 0 0; font-family: 'Big Shoulders Stencil Display', Impact, system-ui, sans-serif;
    font-weight: 600; font-size: clamp(56px, 12vw, 128px); line-height: 0.9;
    letter-spacing: 0.01em; text-transform: uppercase; }
  .select h1 .dot { color: #ebb023; }
  .select .sub { margin: 18px 0 0; max-width: 560px; font-size: 15px;
    line-height: 1.6; color: #8e8d8a; }
  .select .list { margin-top: clamp(34px, 6vh, 56px); display: flex;
    flex-direction: column; gap: 14px; }
  .select .card { display: flex; align-items: center; justify-content: space-between;
    gap: 20px; padding: 22px clamp(18px, 3vw, 30px); background: #131314;
    border: 1px solid #2a2a2c; border-radius: 2px; cursor: pointer;
    text-align: left; color: inherit; font: inherit; width: 100%;
    transition: border-color .15s ease, background .15s ease; }
  .select .card:hover { border-color: #ebb023; background: #181819; }
  .select .card:hover .arrow { color: #ebb023; transform: translateX(4px); }
  .select .cbrand { margin: 0; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    font-size: 11px; font-weight: 600; letter-spacing: 0.22em; color: #ebb023; }
  .select .ctitle { margin: 8px 0 0; font-family: 'Big Shoulders Stencil Display', Impact, system-ui, sans-serif;
    font-weight: 600; font-size: clamp(26px, 4.5vw, 40px); line-height: 0.95;
    text-transform: uppercase; }
  .select .csub { margin: 10px 0 0; font-size: 14px; line-height: 1.5; color: #8e8d8a; }
  .select .cmeta { margin: 10px 0 0; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: #5c5b58; }
  .select .arrow { flex: 0 0 auto; font-size: 26px; color: #5c5b58;
    transition: color .15s ease, transform .15s ease; }
  .select .empty { padding: 30px 0; color: #8e8d8a; }
  .select .foot { margin-top: auto; padding-top: 56px; display: flex;
    align-items: center; justify-content: space-between; gap: 12px;
    font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.12em; color: #5c5b58; }

  /* ---- screen 2: workshop login (course identity) ---- */
  .login { --accent: #ff8a48; min-height: 100dvh; background: #000; color: #e8e8e8; }
  .login .wrap { min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px; position: relative; }
  .login .top { position: absolute; top: 0; left: 0; right: 0; padding: 22px 28px;
    display: flex; align-items: center; justify-content: space-between; }
  .login .back { background: none; border: none; color: #8f8f8f; font: inherit;
    font-size: 13px; letter-spacing: 2px; cursor: pointer; }
  .login .back:hover { color: #ff8a48; }
  .login h1 { margin: 0; font-weight: 400; font-size: clamp(38px, 8vw, 84px);
    line-height: 1; text-align: center; letter-spacing: -1px; }
  .login .scribble { width: min(420px, 70vw); height: 12px; margin-top: 14px; display: block; }
  .login .sub { margin: 22px 0 0; font-size: 18px; color: #b4b4b4; text-align: center; max-width: 560px; }
  .login form { margin-top: 46px; width: min(420px, 100%); padding: 34px 30px 26px;
    border: 2.5px solid #454545; border-radius: 30px;
    background: rgba(255,255,255,0.02); display: flex; flex-direction: column; }
  .login label { font-size: 13px; letter-spacing: 3px; color: #8f8f8f; }
  .login input { margin: 12px 0 18px; padding: 12px 16px; min-height: 44px;
    font-size: 16px; color: #e8e8e8; background: rgba(255,255,255,0.04);
    border: 1px solid #454545; border-radius: 10px; outline: none; width: 100%; font-family: inherit; }
  .login input:focus { border-color: #ff8a48; }
  .login button[type=submit] { padding: 12px 16px; min-height: 44px; font-size: 15px;
    letter-spacing: 3px; color: #000; background: #ff8a48; border: none;
    border-radius: 999px; cursor: pointer; font-family: inherit; }
  .login button[type=submit]:hover { background: #e97132; }
  .login button[type=submit]:disabled { opacity: .35; cursor: not-allowed; }
  .login .error { margin: 0 0 14px; padding: 10px 14px; border: 1px solid #7a2e2e;
    border-radius: 10px; background: #1d0e0e; font-size: 14px; display: none; }
  .login .error.show { display: block; }
  .login .foot { margin-top: 46px; font-size: 12px; letter-spacing: 4px;
    color: #8f8f8f; text-align: center; }
</style>
</head>
