<main class="gate">
  <div class="gate__top">
    <a class="gate__back" routerLink="/">← {{ 'login.all_workshops' | transloco }}</a>
    <ws-lang-toggle />
  </div>

  <h1 class="gate__title">{{ brand }}</h1>
  <svg class="gate__scribble" viewBox="0 0 860 24" fill="none" aria-hidden="true">
    <path
      d="M6 12.5C120 10 260 14.5 400 12S640 10.5 740 13 830 11.5 854 12.3"
      stroke="#E97132"
      stroke-width="6.5"
      stroke-linecap="round"
    />
  </svg>
  @if (subtitle()) {
    <p class="gate__subtitle">{{ subtitle() }}</p>
  }

  <form class="gate__card" (ngSubmit)="submit()">
    <label class="gate__label" for="username">
      {{ 'login.username' | transloco }}
    </label>
    <input
      id="username"
      class="gate__input"
      type="text"
      name="username"
      autocomplete="username"
      autocapitalize="none"
      [(ngModel)]="username"
    />

    <label class="gate__label" for="password">
      {{ 'login.password' | transloco }}
    </label>
    <div class="gate__pw">
      <input
        id="password"
        class="gate__input"
        [type]="showPassword() ? 'text' : 'password'"
        name="password"
        autocomplete="current-password"
        [(ngModel)]="password"
        [placeholder]="'•••••••••'"
      />
      <button
        class="gate__pw-toggle"
        type="button"
        (click)="togglePassword()"
        [attr.aria-pressed]="showPassword()"
        [attr.aria-label]="
          (showPassword() ? 'login.hide_password' : 'login.show_password')
            | transloco
        "
      >
        @if (showPassword()) {
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
            <line x1="1" y1="1" x2="23" y2="23" />
          </svg>
        } @else {
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        }
      </button>
    </div>
    <button class="gate__button" type="submit" [disabled]="busy()">
      {{ 'login.enter' | transloco }}
    </button>
  </form>

  <footer class="gate__footer">
    <span class="gate__status">SINTEZAUR × ZEEDO · POWERED BY SEQUENTIAL</span>
  </footer>
</main>
