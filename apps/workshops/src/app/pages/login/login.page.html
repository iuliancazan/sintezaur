<main class="gate">
  <div class="gate__top">
    <a class="gate__back" routerLink="/">← {{ 'login.all_workshops' | transloco }}</a>
    <ws-lang-toggle />
  </div>

  <h1 class="gate__title">{{ brand }}</h1>
  <svg class="gate__scribble" viewBox="0 0 860 24" fill="none" aria-hidden="true">
    <path
      d="M6 12.5C120 10 260 14.5 400 12S640 10.5 740 13 830 11.5 854 12.3"
      stroke="#E97132"
      stroke-width="6.5"
      stroke-linecap="round"
    />
  </svg>
  @if (subtitle()) {
    <p class="gate__subtitle">{{ subtitle() }}</p>
  }

  <form class="gate__card" (ngSubmit)="submit()">
    <label class="gate__label" for="username">
      {{ 'login.username' | transloco }}
    </label>
    <input
      id="username"
      class="gate__input"
      type="text"
      name="username"
      autocomplete="username"
      autocapitalize="none"
      [(ngModel)]="username"
    />

    <label class="gate__label" for="password">
      {{ 'login.password' | transloco }}
    </label>
    <input
      id="password"
      class="gate__input"
      type="password"
      name="password"
      autocomplete="current-password"
      [(ngModel)]="password"
      [placeholder]="'•••••••••'"
    />
    <button class="gate__button" type="submit" [disabled]="busy()">
      {{ 'login.enter' | transloco }}
    </button>
  </form>

  <footer class="gate__footer">
    <span class="gate__status">SINTEZAUR × ZEEDO · POWERED BY SEQUENTIAL</span>
  </footer>
</main>
