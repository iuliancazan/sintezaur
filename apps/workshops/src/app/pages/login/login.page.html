<main class="gate">
  <ws-portal-nav [crumbs]="crumbs" [underline]="false" />

  <div class="gate__center">
    <p class="gate__kicker">{{ brand }}</p>
    <h1 class="gate__title">{{ title() }}</h1>
    <svg
      class="gate__scribble"
      viewBox="0 0 430 14"
      preserveAspectRatio="none"
      aria-hidden="true"
    >
      <path
        d="M4 9 C 90 4, 200 11, 300 7 S 410 6, 426 8"
        fill="none"
        stroke="#E97132"
        stroke-width="4"
        stroke-linecap="round"
      />
    </svg>
    @if (subtitle()) {
      <p class="gate__subtitle">{{ subtitle() }}</p>
    }

    <form class="gate__card" (ngSubmit)="submit()">
      <div class="gate__field">
        <label class="gate__label" for="username">
          {{ 'login.username' | transloco }}
        </label>
        <input
          id="username"
          class="gate__input"
          type="text"
          name="username"
          autocomplete="username"
          autocapitalize="none"
          [(ngModel)]="username"
          (keydown.enter)="onEnter($event)"
        />
      </div>

      <div class="gate__field">
        <label class="gate__label" for="password">
          {{ 'login.password' | transloco }}
        </label>
        <div class="gate__pw">
          <input
            id="password"
            class="gate__input"
            [type]="showPassword() ? 'text' : 'password'"
            name="password"
            autocomplete="current-password"
            [(ngModel)]="password"
            [placeholder]="'••••••••'"
            (keydown.enter)="onEnter($event)"
          />
          <button
            class="gate__pw-toggle"
            type="button"
            (click)="togglePassword()"
            [attr.aria-pressed]="showPassword()"
            [attr.aria-label]="
              (showPassword() ? 'login.hide_password' : 'login.show_password')
                | transloco
            "
          >
            @if (showPassword()) {
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            } @else {
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            }
          </button>
        </div>
      </div>

      <button class="gate__button" type="submit" [disabled]="busy()">
        {{ 'login.enter' | transloco }}
      </button>
      <p class="gate__helper">{{ 'login.helper' | transloco }}</p>
    </form>
  </div>

  <footer class="gate__footer">
    <span>SINTEZAUR × ZEEDO · POWERED BY SEQUENTIAL</span>
  </footer>
</main>
