<main class="gate">
  <p class="gate__brand">SINTEZAUR</p>

  <h1 class="gate__title">WORKSHOPS</h1>
  <svg class="gate__scribble" viewBox="0 0 860 24" fill="none" aria-hidden="true">
    <path
      d="M6 12.5C120 10 260 14.5 400 12S640 10.5 740 13 830 11.5 854 12.3"
      stroke="#E97132"
      stroke-width="6.5"
      stroke-linecap="round"
    />
  </svg>
  <p class="gate__subtitle">Hands-on courses &amp; workshop materials</p>

  <section class="gate__card">
    <label class="gate__label" for="password">WORKSHOP PASSWORD</label>
    <input
      id="password"
      class="gate__input"
      type="password"
      autocomplete="current-password"
      disabled
      placeholder="•••••••••"
    />
    <button class="gate__button" type="button" disabled>ENTER</button>
    <p class="gate__hint">Login goes live with the first build — W1 in progress.</p>
  </section>

  <footer class="gate__footer">
    <span
      class="gate__dot"
      [class.gate__dot--ok]="apiStatus() === 'ok'"
      [class.gate__dot--down]="apiStatus() === 'down'"
    ></span>
    <span class="gate__status">API {{ apiStatus() }}</span>
  </footer>
</main>
